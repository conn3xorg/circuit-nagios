name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: rocky10, web_path: /nagios }
          - { distro: fedora45, web_path: /nagios }
          - { distro: ubuntu2404, web_path: /nagios }
          - { distro: debian13, web_path: /nagios4 }
    name: e2e (${{ matrix.distro }})
    env:
      PODMAN: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check the password stayed out of state
        working-directory: examples/local
        run: "! grep -q example-password terraform.tfstate"
      - name: Check only root can read the password file
        run: sudo podman exec circuit-nagios stat -c '%U %a' /etc/conn3x/nagios /etc/conn3x/nagios/web-password | sed 's/^/ /' | grep -c '^ root [67]00$' | grep -qx 2
      - name: Check a passing check shows OK and a failing one CRITICAL
        run: |
          sudo podman cp test/check-status.sh circuit-nagios:/tmp/check-status.sh
          sudo podman exec circuit-nagios sh /tmp/check-status.sh ${{ matrix.web_path }} example-password-change-me
      # The bad service names a command that doesn't exist.
      - name: Check a bad config fails the apply, twice, and Nagios keeps running
        working-directory: examples/local
        run: |
          bad='define service {
            use generic-service
            host_name self
            service_description bad
            check_command no_such_command
          }'
          conn3x apply -auto-approve -var "extra_objects=$bad" && exit 1
          conn3x apply -auto-approve -var "extra_objects=$bad" && exit 1
          sudo podman exec circuit-nagios sh -c 'systemctl is-active nagios || systemctl is-active nagios4'
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
